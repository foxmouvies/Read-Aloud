<!doctype html><html><head><title>Harbour</title><style>p{color:red}</style><script>var x="should not be read";</script></head><body><nav>Menu Home</nav><article><p>The harbour festival starts on Friday evening.</p><p>Everyone is welcome at the pier near the old lighthouse.</p><p>Musicians will play until midnight and food stalls stay open. Children can join the lantern parade at seven.</p><p>The last boat leaves the dock at eleven thirty.</p></article></body></html>
